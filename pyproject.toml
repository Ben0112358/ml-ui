[tool.poetry]
name = "ml-ui"
version = "0.1.0"
description = ""
authors = ["Ben0112358"]
readme = "README.md"

packages = [
  { include = "ml_ui", from = "src" }
]

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
nicegui = ">=2.21.1,<3.0.0"
requests = ">=2.33.0,<3.0.0"


[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
black = "^26.3.1"
flake8 = "^7.3.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 79

[tool.pytest.ini_options]
pythonpath = ["src"]
