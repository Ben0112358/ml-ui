[tool.poetry]
name = "ml-ui"
version = "0.1.0"
description = ""
authors = ["Ben0112358 <benjaminringdahl@gmail.com>"]
readme = "README.md"

packages = [
  { include = "ml_ui", from = "src" }
]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
nicegui = ">=2.21.1,<3.0.0"
requests = ">=2.32.4,<3.0.0"


[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
black = "^25.1.0"
flake8 = "^7.3.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 79

[tool.flake8]
line-length = 79
